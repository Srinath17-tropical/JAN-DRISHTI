services:
  - type: web
    name: jan-drishti-telangana
    runtime: node
    plan: free
    buildCommand: bun install && bun run build
    startCommand: npx tsx server.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
